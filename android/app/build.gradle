plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shaneqwq.lifeassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.shaneqwq.lifeassistant"
        minSdk 26                // 8.0 以上，WebView 才有足夠新的 Chromium
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    // ── 固定簽章金鑰 ──────────────────────────────────────────────
    // 預設的 debug 金鑰是 Gradle 在建置機器上隨機產生的，每次 CI 執行都不
    // 一樣，導致新版 APK 因簽章不符而無法覆蓋安裝，使用者每次更新都得先
    // 卸載、連帶失去 app 內的資料。
    //
    // 改用一把固定的 keystore：CI 會從 ANDROID_KEYSTORE_BASE64 secret 解出
    // android/release.p12，密碼由 ANDROID_KEYSTORE_PASSWORD 提供。
    // 本機沒有這兩者時自動退回 Gradle 預設 debug 金鑰，手動建置不受影響。
    def ksFile = rootProject.file('release.p12')
    def ksPassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def useFixedKey = ksFile.exists() && ksPassword

    signingConfigs {
        fixed {
            storeType 'PKCS12'
            storeFile ksFile
            storePassword ksPassword ?: ''
            keyAlias 'lifeassistant'
            keyPassword ksPassword ?: ''
        }
    }

    buildTypes {
        debug {
            // 除錯版可直接側載安裝；有固定金鑰時改用它，確保能覆蓋更新
            if (useFixedKey) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true          // AppHost.appVersion() 會用到 BuildConfig
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 相依套件會各自帶進不同版本的 Kotlin stdlib，而 kotlin-stdlib-jdk7/jdk8
    // 自 1.8 起已併入 kotlin-stdlib，版本不一致就會出現重複類別。
    // 用 BOM 把所有 kotlin 模組對齊到同一版本。
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// ── 把專案根目錄的網頁檔複製進 assets/www ─────────────────────────────
// 網頁只有一份來源（repo 根目錄），不必在 android/ 底下維護重複檔案
def webRoot = rootProject.file('..')
def webAssetsDir = new File(layout.buildDirectory.get().asFile, 'generated/webassets')

tasks.register('copyWebAssets', Copy) {
    from(webRoot) {
        include 'index.html', 'manifest.json', 'sw.js', 'icon.svg', 'jsqr.js', 'quagga.min.js', 'web-files.json'
    }
    into new File(webAssetsDir, 'www')
}

android.sourceSets.main.assets.srcDirs += webAssetsDir

// preBuild 是建置流程的第一個任務，掛在這裡可確保檔案早於 mergeAssets 就緒
tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
